[project]
name = "relog"
version = "0.1.0"
description = "Execution-aware logging with runtime feedback for LLM-oriented debugging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "dspy>=3.0.4",
    "gitpython>=3.1.45",
    "ipykernel>=6.30.1",
    "javalang>=0.13.0",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.6",
    "matplotlib>=3.10.6",
    "openai>=2.8.1",
    "pandas>=2.3.2",
    "sentencepiece>=0.2.1",
    "tokenizers>=0.22.1",
    "tqdm>=4.67.1",
    "transformers>=4.35",
    "tree-sitter>=0.25.1",
    "tree-sitter-java>=0.23.5",
    "unidiff>=0.7.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["relog", "executor/d4j_executor", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "executor/defects4j",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]
ignore = [
    "E501",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false
line-ending = "auto"
